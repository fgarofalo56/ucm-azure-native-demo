version: 2
updates:
  # ---------------- GitHub Actions ----------------
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "09:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(deps)"
    # Batch all action bumps into a single PR.
    groups:
      actions:
        patterns:
          - "*"

  # ---------------- Python (backend + functions) ----------------
  - package-ecosystem: "pip"
    directories:
      - "/src/backend"
      - "/src/functions"
    schedule:
      interval: "monthly"
      time: "09:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "chore(deps)"
    # One grouped PR for all minor/patch bumps; majors are ignored below.
    groups:
      python-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Ignore major version updates for stability (review manually).
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # ---------------- npm (frontend) ----------------
  - package-ecosystem: "npm"
    directory: "/src/frontend"
    schedule:
      interval: "monthly"
      time: "09:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "javascript"
    commit-message:
      prefix: "chore(deps)"
    # One grouped PR for all minor/patch bumps; majors are ignored below.
    groups:
      npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Ignore major version updates for stability (review manually).
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
